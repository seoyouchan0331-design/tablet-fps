name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npx vite build --sourcemap false
        env:
          # Optional closer TURN relay for players on different networks
          # (src/net/ice.js). Set as repository *variables*, not secrets: the
          # key ends up in the page anyway, Metered issues it for browser use.
          VITE_METERED_APP: ${{ vars.METERED_APP }}
          VITE_METERED_KEY: ${{ vars.METERED_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
